# Copy to .github/workflows/hygiene.yml in the repo whose skills/ should be reviewed.
# Add LEDGER.md to that repo's .prettierignore if it runs Prettier over markdown.
name: Skill Hygiene

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# ------------------------------------------------------------------------------------------------------------------------

jobs:
  hygiene:
    name: Rate and review skills
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the hygiene skill
        uses: actions/checkout@v5
        with:
          repository: dasistweb/skills
          path: .hygiene

      - name: Selftest
        run: python3 .hygiene/skills/hygiene/hygiene.py --selftest

      - name: Ledger (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python3 .hygiene/skills/hygiene/hygiene.py .
          cat LEDGER.md

      - name: Ledger and issues (main)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .hygiene/skills/hygiene/hygiene.py . --issues
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LEDGER.md
          git diff --cached --quiet || (git commit -m "NTR: hygiene ledger" && git push)
