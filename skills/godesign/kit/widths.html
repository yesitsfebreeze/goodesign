<!doctype html>
<!--
  godesign widths harness — gate line 14, verified.
  Chrome will not shrink its window below ~500px, so each width is an iframe of
  the exact size. Run from the directory holding the page to test:

    chrome --headless=new --allow-file-access-from-files \
      --virtual-time-budget=6000 --dump-dom \
      "file://$PWD/widths.html?page=index.html" | sed -n '/<pre id=report>/,/<\/pre>/p'

  Reports, per width: scrollWidth vs clientWidth (horizontal scroll = fail),
  every element whose right edge exceeds the width, every h1–h3 with a
  single-word last line, and the computed size of body, h1, h2.
-->
<meta charset="utf-8"><title>widths</title>
<style>body{margin:0;font:12px/1.4 monospace}iframe{border:0;display:block}</style>
<pre id="report">running…</pre>
<script>
const page = new URLSearchParams(location.search).get('page') || 'index.html';
const widths = [360, 768, 900, 1440];
const out = [];
async function run(w) {
  const f = document.createElement('iframe');
  f.width = w; f.height = 900; f.src = page;
  document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  await new Promise(r => setTimeout(r, 400));
  const d = f.contentDocument, win = f.contentWindow;
  const de = d.documentElement;
  const lines = [`\n== ${w}px ==`];
  lines.push(`scroll ${de.scrollWidth} vs client ${de.clientWidth}  ${de.scrollWidth > de.clientWidth ? 'FAIL horizontal scroll' : 'ok'}`);
  const over = [...d.querySelectorAll('body *')].filter(e => {
    const r = e.getBoundingClientRect(); return r.width && r.right > w + 1;
  }).slice(0, 8);
  over.forEach(e => lines.push(`overflow  <${e.tagName.toLowerCase()}${e.className ? '.' + String(e.className).split(' ')[0] : ''}> right=${Math.round(e.getBoundingClientRect().right)}`));
  d.querySelectorAll('h1,h2,h3').forEach(h => {
    const words = h.textContent.trim().split(/\s+/); if (words.length < 2) return;
    const range = d.createRange(); const rects = () => range.getClientRects().length;
    range.selectNodeContents(h); const total = rects();
    const last = h.lastChild; if (!last || last.nodeType !== 3) return;
    const t = last.textContent, i = t.lastIndexOf(' '); if (i < 0) return;
    range.setStart(last, i + 1); range.setEnd(last, t.length);
    const lr = range.getClientRects(); if (!lr.length) return;
    const full = h.getBoundingClientRect();
    if (total > 1 && lr[0].left <= full.left + 1 && lr[0].right - lr[0].left < full.width * 0.35)
      lines.push(`widow     <${h.tagName.toLowerCase()}> "${words.at(-1)}"`);
  });
  const cs = s => { const e = d.querySelector(s); return e ? win.getComputedStyle(e).fontSize : '—'; };
  lines.push(`type      body ${cs('body')} · h1 ${cs('h1')} · h2 ${cs('h2')}`);
  out.push(lines.join('\n')); f.remove();
}
(async () => { for (const w of widths) await run(w); document.getElementById('report').textContent = out.join('\n'); })();
</script>
